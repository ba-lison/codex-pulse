<!doctype html>
<html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uso restante</title><style>
:root {color-scheme:dark;font:13px/1.5 var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);color:#ededed;background:#18181b;--panel-text:#ededed;--panel-muted:#8f8f99;--panel-line:#ffffff12;--panel-track:#ffffff12;}
*{box-sizing:border-box}body{margin:0;min-width:0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #90b7f5;outline-offset:4px}
  .companion { display:flex; align-items:center; gap:13px; padding:15px 0 18px; }
  .mascot-stage { position:relative; isolation:isolate; flex:0 0 116px; width:116px; height:126px; }
  .mascot-stage .mascot { position:absolute; left:5px; bottom:4px; width:72px; height:78px; z-index:3; transform-origin:50% 90%; }
  .principal-crown { position:absolute; left:0; top:0; width:22px; height:15px; z-index:3; color:#d7bd83; transform:translate(25.75px,.38px); filter:drop-shadow(0 1px 1px #11111480); pointer-events:none; }
  .mascot-ground { position:absolute; left:15px; bottom:3px; width:51px; height:5px; border-radius:50%; background:#09090b; opacity:.45; }
  .activity-prop { position:absolute; left:55px; top:0; width:75px; height:53px; z-index:2; color:#b7cef3; transform:scale(.62); transform-origin:top left; opacity:.82; pointer-events:none; }
  .prop-bubble { position:relative; width:75px; height:49px; display:flex; align-items:center; justify-content:center; border:1px solid #44444c; border-radius:9px; background:#202024; box-shadow:0 2px 5px #10101230; }
  .prop-bubble::after { content:''; position:absolute; bottom:-4px; left:13px; width:7px; height:7px; transform:rotate(45deg); background:#202024; border-right:1px solid #44444c; border-bottom:1px solid #44444c; }
  .prop-bubble svg { display:block; overflow:visible; }
  .thought-cloud { position:relative; width:75px; height:49px; }
  .thought-cloud > svg { width:75px; height:49px; color:#6b6b77; overflow:visible; }
  .thought-dots { position:absolute; display:flex; gap:5px; left:27px; top:19px; }
  .thought-dots i { width:4px; height:4px; background:#b7cef3; border-radius:50%; animation:thought 1.8s ease-in-out infinite; }
  .thought-dots i:nth-child(2) { animation-delay:.22s; }
  .thought-dots i:nth-child(3) { animation-delay:.44s; }
  .waiting-sign { position:absolute; top:9px; left:6px; display:flex; align-items:center; justify-content:center; gap:5px; width:68px; height:31px; border:1px solid #be9c64; border-radius:5px; background:#343024; color:#efd29e; font-size:11px; font-weight:500; transform-origin:17px 54px; animation:raise-sign 2.8s ease-in-out infinite; }
  .waiting-sign::after { content:''; position:absolute; width:4px; height:26px; top:29px; left:15px; border-radius:0 0 2px 2px; background:#96794c; z-index:-1; }
  .waiting-sign svg { width:13px; height:13px; }
  .terminal-prop { display:block; padding:6px 7px; align-items:initial; color:#b7d8c8; }
  .terminal-top { display:flex; align-items:center; gap:3px; height:6px; margin-bottom:5px; }
  .terminal-top i { width:3px; height:3px; border-radius:50%; background:#7d8e85; }
  .terminal-top span { height:2px; width:27px; background:#50545a; margin-left:auto; }
  .terminal-code { display:flex; align-items:center; gap:4px; height:10px; font:11px/1 ui-monospace,Consolas,monospace; }
  .terminal-type { display:inline-block; width:30px; height:3px; transform-origin:left; background:repeating-linear-gradient(to right,#b7d8c8 0 3px,transparent 3px 5px); animation:type-command 2.4s steps(6,end) infinite; }
  .terminal-caret { display:inline-block; width:4px; height:9px; background:#b7d8c8; animation:caret .9s steps(1) infinite; }
  .terminal-output { display:block; height:2px; margin:4px 0 0 10px; width:33px; background:#727d78; transform-origin:left; animation:terminal-output 2.4s ease infinite; }
  .terminal-output.short { width:23px; margin-top:3px; animation-delay:.15s; }
  .web-globe { transform-origin:29px 25px; animation:globe-turn 3.6s ease-in-out infinite; }
  .web-search { animation:search-web 2.4s ease-in-out infinite; }
  .web-dot { transform-origin:29px 25px; animation:orbit-web 4s linear infinite; }
  .book-scan { animation:scan-book 2.8s ease-in-out infinite; }
  .reading-prop { align-items:flex-start; padding-top:3px; }
  .editor-pen { animation:write-file 1.9s ease-in-out infinite; }
  .editor-line { transform-origin:19px 0; animation:write-line 2.8s ease-in-out infinite; }
  .compress-paper { transform-origin:12px 15px; animation:compact-paper 2.6s ease-in-out infinite; }
  .compress-paper.second { animation-delay:.2s; }
  .compact-summary { animation:compact-summary 2.6s ease-in-out infinite; }
  .compact-caption { position:absolute; left:0; bottom:4px; width:100%; text-align:center; font-size:9px; color:#aaaab4; }
  .compact-prop { align-items:flex-start; padding-top:4px; }
  .node-a { animation:node-work 2.4s ease-in-out infinite; }
  .node-b { animation:node-work 2.4s .8s ease-in-out infinite; }
  .node-c { animation:node-work 2.4s 1.6s ease-in-out infinite; }
  .done-prop { color:#a8d8bb; }
  .done-check { stroke-dasharray:24; stroke-dashoffset:0; animation:draw-check .5s ease-out both; }
  .stop-prop { color:#e4a2a2; }
  .stop-prop svg { animation:stop-arrival .3s ease-out both; }
  .error-prop { color:#e1b87c; }
  .mascot-stage[data-state=waiting] .mascot { animation:attention-body 2.8s ease-in-out infinite; }
  .mascot-stage[data-state=idle] .mascot { animation:rest-breathe 4s ease-in-out infinite; }
  .mascot-stage[data-state=interrupted] .mascot { animation:stop-body .35s ease-out both; }
  .mascot-stage[data-state=compacting] .mascot { animation:compact-body 2.6s ease-in-out infinite; }
  @keyframes thought { 0%,65%,100% { opacity:.35; transform:translateY(0); } 25% { opacity:1; transform:translateY(-2px); } }
  @keyframes raise-sign { 0%,100% { transform:translateY(1px) rotate(-5deg); } 45%,65% { transform:translateY(-4px) rotate(0); } }
  @keyframes attention-body { 0%,100% { transform:rotate(-1deg); } 50% { transform:rotate(2deg); } }
  @keyframes type-command { 0%,10% { transform:scaleX(0); } 55%,85% { transform:scaleX(1); } 100% { transform:scaleX(0); } }
  @keyframes caret { 50% { opacity:0; } }
  @keyframes terminal-output { 0%,45%,100% { opacity:.15; transform:scaleX(.5); } 65%,85% { opacity:.8; transform:scaleX(1); } }
  @keyframes globe-turn { 0%,100% { transform:scaleX(1); } 50% { transform:scaleX(.6); } }
  @keyframes search-web { 0%,100% { transform:translate(0,0); } 50% { transform:translate(-4px,-3px); } }
  @keyframes orbit-web { to { transform:rotate(360deg); } }
  @keyframes scan-book { 0%,100% { transform:translateY(0); opacity:.3; } 50% { transform:translateY(12px); opacity:.9; } }
  @keyframes write-file { 0%,100% { transform:translate(0,0); } 35% { transform:translate(-4px,3px); } 65% { transform:translate(1px,5px); } }
  @keyframes write-line { 0%,100% { transform:scaleX(.25); } 75% { transform:scaleX(1); } }
  @keyframes compact-paper { 0%,15%,100% { transform:translateX(0) scaleX(1); opacity:1; } 55%,80% { transform:translateX(15px) scaleX(.4); opacity:.2; } }
  @keyframes compact-summary { 0%,20%,100% { opacity:.45; } 60%,85% { opacity:1; } }
  @keyframes compact-body { 0%,100% { transform:translateY(0); } 55% { transform:translateY(2px) scaleY(.97); } }
  @keyframes node-work { 0%,100% { opacity:.35; } 35% { opacity:1; } }
  @keyframes draw-check { from { stroke-dashoffset:24; } to { stroke-dashoffset:0; } }
  @keyframes stop-arrival { from { transform:scale(.8); opacity:.3; } to { transform:scale(1); opacity:1; } }
  @keyframes stop-body { 0% { transform:translateX(2px) rotate(3deg); } 55% { transform:translateX(-1px) rotate(-2deg); } 100% { transform:none; } }
  @keyframes rest-breathe { 0%,100% { transform:translateY(1px) scaleY(.98); } 50% { transform:translateY(-1px) scaleY(1); } }
  .mascot { flex:0 0 64px; width:64px; height:69.3333px; background-image:url('__CODEX_SPRITE__'); background-size:800% 1100%; background-position:0 0; background-repeat:no-repeat; }
  .activity { min-width:0; }
  .activity-title { font-size:13px; font-weight:500; margin:0 0 3px; }
  .activity-detail { margin:0; color:#8f8f99; font-size:11px; text-wrap:pretty; }
  .meter { border-top:1px solid #ffffff12; padding:19px 0 23px; }
  .meter-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .meter h3 { margin:0; font-size:12px; font-weight:500; color:#d3d3d9; }
  .values { display:flex; align-items:baseline; justify-content:space-between; gap:8px; font-variant-numeric:tabular-nums; margin-bottom:12px; }
  .large { font-size:29px; font-weight:600; letter-spacing:-1px; line-height:1.15; }
  .suffix { font-size:11px; color:#91919a; margin-left:5px; }
  .available { font-size:11px; color:#a0a0aa; white-space:nowrap; }
  .track { height:5px; background:#ffffff12; border-radius:3px; overflow:hidden; }
  .fill { width:100%; height:100%; border-radius:inherit; background:#90b7f5; transform-origin:left; transform:scaleX(.14); transition:transform .45s ease,background .2s; }
  .context-fill { background:#90b7f5; }
  .context[data-severity=warning] .context-fill { background:#dfb474; }
  .context[data-severity=danger] .context-fill { background:#ee9393; }
  .reset { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:3px 12px; margin:13px 0 0; color:#9696a0; font-size:11px; font-variant-numeric:tabular-nums; }
  .reset strong { color:#d1d1d7; font-weight:400; }
  .tokens-line { margin:13px 0 0; font-size:15px; font-weight:500; text-align:right; color:#b9b9c3; font-variant-numeric:tabular-nums; }
  .tokens-line .used { color:#ededf2; }
  .tokens-line .slash { margin:0 5px; color:#8e8e99; }
  .warning[hidden],.error[hidden] { display:none; }
  .warning { margin:15px 0 0; padding-left:9px; border-left:1px solid #ffffff20; color:#9898a3; font-size:11px; line-height:1.65; text-wrap:pretty; }
  .warning[data-level=suggest],.warning[data-level=constant] { border-left-color:#b8a17a70; color:#c0ad8e; }
  .crew-controls { margin-top:26px; padding-top:20px; border-top:1px solid #ffffff12; }
  .crew-controls .control { margin-bottom:12px; }
  .crew[hidden],.crew-list[hidden] { display:none; }
  .crew { border-top:1px solid #ffffff12; padding-top:19px; }
  .crew-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .crew-heading h3 { margin:0; display:flex; align-items:center; gap:8px; font-size:12px; font-weight:500; color:#d3d3d9; }
  .crew-count { min-width:18px; padding:1px 5px; background:#ffffff09; border-radius:4px; font-size:10px; text-align:center; color:#b8b8c3; font-variant-numeric:tabular-nums; }
  .crew-toggle { display:flex; align-items:center; gap:4px; padding:4px 0 4px 6px; font-size:10px; color:#9696a1; background:transparent; border:0; border-radius:4px; }
  .crew-toggle:hover { color:#ddddE5; }
  .crew-toggle svg { width:12px; height:12px; transition:transform .15s; }
  .crew-toggle[aria-expanded=false] svg { transform:rotate(-90deg); }
  .crew-summary { margin:5px 0 0; font-size:11px; color:#898994; font-variant-numeric:tabular-nums; }
  .agent { padding:19px 0 17px; border-bottom:1px solid #ffffff0c; }
  .agent:last-child { border-bottom:0; padding-bottom:2px; }
  .agent-heading { display:flex; align-items:center; gap:9px; min-width:0; }
  .agent-mascot { position:relative; flex:0 0 42px; width:42px; height:45.5px; }
  .agent-name-block { flex:1; min-width:0; }
  .agent-name { display:block; margin:0; font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#dedee5; }
  .agent-model { margin:2px 0 0; font-size:10px; color:#858591; }
  .agent-stop { flex:0 0 auto; display:flex; align-items:center; gap:5px; padding:5px 6px; margin-right:-6px; background:transparent; border:0; border-radius:5px; font-size:10px; color:#9999a4; }
  .agent-stop svg { width:8px; height:8px; }
  .agent-stop:hover { background:#ee93930b; color:#dfaaaa; }
  .agent-stop:disabled { color:#777783; cursor:wait; }
  .agent-outcome { margin-left:auto; color:#a0bfae; display:grid; place-items:center; }
  .agent-outcome svg { width:15px; height:15px; }
  .agent[data-state=interrupted] .agent-outcome,.agent[data-state=error] .agent-outcome { color:#c1a0a0; }
  .agent-activity { display:flex; align-items:center; gap:6px; margin:10px 0 3px; font-size:11px; color:#b7b7c1; }
  .agent-activity svg { width:12px; height:12px; flex:0 0 12px; color:#8b9bb7; }
  .agent-target { margin:0 0 13px; color:#7f7f8b; font-size:10px; line-height:1.6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .agent-metric { display:flex; justify-content:space-between; gap:10px; margin:11px 0 6px; font-size:10px; color:#858591; font-variant-numeric:tabular-nums; }
  .agent-metric .metric-value { color:#b8b8c4; text-align:right; }
  .agent-track { height:3px; background:#ffffff0c; border-radius:2px; overflow:hidden; }
  .agent-track .fill { transition:transform .3s; }
  .agent-track.context-track { height:2px; }
  .context-track .fill { background:#899bb8; opacity:.65; }
  .agent[data-state=done] .task-track .fill { background:#9abbab; }
  .agent[data-state=interrupted] .task-track .fill,.agent[data-state=error] .task-track .fill { background:#a2949c; }
  .agent-footer { display:flex; justify-content:space-between; gap:10px; margin-top:11px; font-size:10px; color:#777783; font-variant-numeric:tabular-nums; }
  .agent-footer time { color:#93939f; }
  .error { margin:0 0 17px; font-size:11px; color:#ceae82; }

.panel{width:100%;max-width:480px;margin:0 auto;padding:20px;min-height:0;overflow-wrap:anywhere}
[hidden]{display:none!important}.panel[data-paused=true] *{animation-play-state:paused!important}.fill{transform:scaleX(0)}.companion{padding-top:15px}.activity-detail{overflow-wrap:anywhere}.values>div{min-width:0}.available{white-space:normal;text-align:right}.agent-stop:disabled{cursor:default}.agent-model{overflow-wrap:anywhere}.agent-metric{flex-wrap:wrap}.agent-target{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.error{margin-top:14px}.track[data-unavailable=true]{opacity:.5}.agent-name{overflow-wrap:anywhere}.agent-footer{flex-wrap:wrap}
:root[data-theme=light]{color-scheme:light;color:#242424;background:#fff;--panel-text:#242424;--panel-muted:#686873;--panel-line:#00000014;--panel-track:#00000012}
:root[data-theme=light] .activity-title,:root[data-theme=light] .large,:root[data-theme=light] .tokens-line .used,:root[data-theme=light] .meter h3,:root[data-theme=light] .crew-heading h3,:root[data-theme=light] .agent-name{color:#242424}
:root[data-theme=light] .activity-detail,:root[data-theme=light] .available,:root[data-theme=light] .suffix,:root[data-theme=light] .reset,:root[data-theme=light] .agent-activity,:root[data-theme=light] .agent-target,:root[data-theme=light] .agent-model,:root[data-theme=light] .agent-footer,:root[data-theme=light] .agent-metric,:root[data-theme=light] .crew-summary{color:#686873}
:root[data-theme=light] .meter,:root[data-theme=light] .crew,:root[data-theme=light] .agent{border-color:#00000014}:root[data-theme=light] .track,:root[data-theme=light] .agent-track{background:#00000012}:root[data-theme=light] .tokens-line,:root[data-theme=light] .reset strong,:root[data-theme=light] .agent-metric .metric-value{color:#555563}
:root[data-theme=light] .warning{color:#656571;border-left-color:#00000020}:root[data-theme=light] .warning[data-level=suggest],:root[data-theme=light] .warning[data-level=constant]{color:#856329;border-left-color:#96733b70}
@media(max-width:360px){.panel{padding:17px}.mascot-stage{flex-basis:104px;width:104px}.companion{gap:9px}.large{font-size:27px}.reset{font-size:10px}}
@media(max-width:260px){.panel{padding:12px}.companion{gap:4px}.mascot-stage{flex-basis:94px;width:94px}.activity-prop{left:48px;transform:scale(.56)}.values{flex-wrap:wrap}.available{margin-left:auto}.crew-heading{gap:5px}.agent-name{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head><body><main id="panel" class="panel" aria-busy="true">          <section class="companion" aria-label="Atividade da conversa">
            <div id="mascot-stage" class="mascot-stage" data-state="unavailable">
              <span class="mascot-ground" aria-hidden="true"></span>
              <div id="mascot" class="mascot" role="img" aria-label="Codex principal: atividade indisponível"><svg id="principal-crown" class="principal-crown" viewBox="0 0 30 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 6 5 5-8 5 8 6-5-2 11H6Z" fill="#8b703e"/><path d="M6 19h18"/><circle cx="4" cy="5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="2" r="1.2" fill="currentColor" stroke="none"/><circle cx="26" cy="5" r="1.2" fill="currentColor" stroke="none"/></svg></div>
              <div id="activity-prop" class="activity-prop" aria-hidden="true"></div>
            </div>
            <div class="activity"><p id="activity-title" class="activity-title" role="status">Atividade indisponível</p><p id="activity-detail" class="activity-detail">O host não forneceu eventos desta conversa.</p></div>
          </section>
          <section class="meter" aria-labelledby="five-title">
            <div class="meter-heading"><h3 id="five-title">Janela de 5 horas</h3></div>
            <div class="values"><div><strong id="five-value" class="large">—</strong><span class="suffix">usado</span></div><span id="five-rest" class="available">Sem leitura</span></div>
            <div id="five-progress" class="track" role="progressbar" aria-label="Consumo na janela de 5 horas" aria-valuemin="0" aria-valuemax="100"><div id="five-fill" class="fill"></div></div>
            <p class="reset"><span>Renova às <strong id="reset-time">—</strong></span><strong id="reset-countdown">Renovação não informada</strong></p>
          </section>
          <section id="context" class="meter context" aria-labelledby="context-title" data-severity="normal">
            <div class="meter-heading"><h3 id="context-title">Contexto</h3></div>
            <div class="values"><div><strong id="context-value" class="large">—</strong><span class="suffix">ocupado</span></div><span id="context-rest-percent" class="available">Não informado</span></div>
            <div id="context-progress" class="track" role="progressbar" aria-label="Ocupação da janela de contexto" aria-valuemin="0" aria-valuemax="100"><div id="context-fill" class="fill context-fill"></div></div>
            <p id="tokens-summary" class="tokens-line"><span id="tokens-used" class="used">—</span><span class="slash">/</span><span id="tokens-limit">—</span></p>
            <p id="context-warning" class="warning" role="note" hidden></p>
          </section>
          <section id="crew" class="crew" aria-labelledby="crew-title" hidden>
            <header class="crew-heading"><h3 id="crew-title">Subagentes <span id="crew-count" class="crew-count" aria-label="Agentes ativos">0</span></h3><button id="crew-toggle" class="crew-toggle" type="button" aria-expanded="true" aria-controls="crew-list"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg><span id="crew-toggle-label">Ocultar</span></button></header>
            <p id="crew-summary" class="crew-summary" title="Consumo acumulado deste grupo; separado da ocupação da janela de contexto."></p>
            <div id="crew-list" class="crew-list"></div>
          </section>
          <p id="read-error" class="error" hidden></p>
</main><script>
(()=>{
  const svg=(content,extra='')=>'<svg viewBox="0 0 64 44" width="64" height="44" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" '+extra+'>'+content+'</svg>';
  const bubble=(content,kind='')=>'<div class="prop-bubble '+kind+'">'+content+'</div>';
  const props={
    thinking:'<div class="thought-cloud">'+svg('<path d="M18 33c-13 0-15-16-5-20 0-11 17-14 23-5 10-5 22 2 20 12 11 9 2 21-9 18H23" fill="#242429"/><circle cx="17" cy="41" r="3" fill="#242429"/><circle cx="10" cy="47" r="1.8" fill="#242429"/>','style="height:54px"')+'<span class="thought-dots"><i></i><i></i><i></i></span></div>',
    waiting:'<div class="waiting-sign"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 2.5h10v7H8l-3 3v-3H3z"/><path d="M8 4.5v2m0 1v.5"/></svg><span>Sua vez</span></div>',
    reading:bubble(svg('<path d="M16 5h22l8 8v25H16z" stroke="#727e93"/><path d="M22 9h19l8 8v24H22z" fill="#242429"/><path d="M41 9v8h8m-21 6h15m-15 6h15m-15 6h10"/><path class="book-scan" d="M26 20h19" stroke="#d9e6fb" stroke-width="2.5"/>','style="height:32px"')+'<span class="compact-caption">lendo arquivos</span>','reading-prop'),

  };
  const onGlobals=event=>{
    const globals=event.detail?.globals;if(!globals||typeof globals!=='object')return;
    globalKeys=[...new Set([...globalKeys,...Object.keys(globals)])].slice(0,80);applyTheme();updateDiagnostics();
    if(globals.toolOutput)accept(globals.toolOutput);
  };
  const onVisibility=()=>{clearTimeout(pollTimer);clearTimeout(animationTimer);clearTimeout(clockTimer);$('panel').dataset.paused=String(isHidden());if(!isHidden()&&!disposed){animate();tickClock();update();}};
  const onReduced=()=>animate(),onScheme=()=>applyTheme();
  const scheme=matchMedia('(prefers-color-scheme: light)');
  const dispose=()=>{
    if(disposed)return;disposed=true;
    for(const timer of [pollTimer,clockTimer,animationTimer,watchdog])clearTimeout(timer);
    for(const request of pending.values()){clearTimeout(request.timeout);request.reject(new Error('Painel encerrado.'));}pending.clear();
    window.removeEventListener('message',onMessage);window.removeEventListener('openai:set_globals',onGlobals);window.removeEventListener('pagehide',dispose);
    document.removeEventListener('visibilitychange',onVisibility);reduced.removeEventListener('change',onReduced);scheme.removeEventListener('change',onScheme);
  };
  $('crew-toggle').addEventListener('click',()=>{crewFolded=!crewFolded;renderCrew();});
  $('crew-list').addEventListener('click',async event=>{
    const button=event.target.closest('[data-stop-agent]');if(!button)return;const id=button.dataset.stopAgent,agent=crewSeen.get(id);
    if(data?.capabilities?.stopAgent!==true||agent?.canStop!==true||stopping.has(id)||ended(agent))return;
    stopping.add(id);stopErrors.delete(id);renderCrew();
    try{
      const result=await callTool('stop_agent',{agentId:id,threadId:data?.conversation?.threadId});
      if(result?.isError)throw new Error(result.content?.find(item=>item.type==='text')?.text||'O host recusou a parada.');
      if(result?.structuredContent?.conversation)accept(result.structuredContent);
      else{stopErrors.set(id,'Parada solicitada; aguardando confirmação do host.');}
    }catch(error){stopping.delete(id);stopErrors.set(id,error.message||'Não foi possível parar este agente.');}
    if(!disposed)renderCrew();
  });
  window.addEventListener('message',onMessage);window.addEventListener('openai:set_globals',onGlobals);window.addEventListener('pagehide',dispose);
  document.addEventListener('visibilitychange',onVisibility);reduced.addEventListener('change',onReduced);scheme.addEventListener('change',onScheme);
  applyTheme();render();accept(window.openai?.toolOutput);tickClock();update();

})();
</script></body></html>
